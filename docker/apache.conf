# Apache inside the container. The host's Apache passes requests to it (deploy/aldervast-site.conf).
<VirtualHost *:80>
    DocumentRoot /app/public
    <Directory /app/public>
        Require all granted
        AllowOverride None
        # Any path that isn't a real file (/, /chat, /mcp) goes to index.php, which picks the handler.
        FallbackResource /index.php
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
