# The host's Apache site for aldervast.versyxdigital.net. It passes every request to the Docker
# container (docker-compose.yml), which listens on 127.0.0.1:8090. deploy/setup-host.sh installs
# this file, and certbot then adds the HTTPS version of it.
<VirtualHost *:80>
    ServerName aldervast.versyxdigital.net

    # certbot proves that we own the domain by putting a file under /.well-known/acme-challenge/.
    # Serve that path from disk here, instead of passing it to the container.
    DocumentRoot /var/www/html
    ProxyPass /.well-known/acme-challenge/ !

    ProxyPreserveHost On
    # An answer from the chatbot can take over a minute, so wait up to 150 seconds.
    ProxyPass / http://127.0.0.1:8090/ timeout=150
    ProxyPassReverse / http://127.0.0.1:8090/
</VirtualHost>
